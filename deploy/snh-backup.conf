# Nightly backup of the things git cannot rebuild, from sparky to the NAS.
# Read by /usr/local/bin/snh-backup. Shell syntax; no command substitution.
#
# DAEMON MODE, NOT SSH. DSM only allows SSH command execution for members of the
# administrators group, and making an unattended backup key a NAS admin gives
# back the isolation the separate account existed to provide. The rsync daemon
# needs no shell, and `auth users` on the module is a real boundary: this
# account cannot read or write any other machine's module.

NAS_HOST=192.168.4.180
NAS_PORT=873
# The rsync account (Control Panel -> File Services -> rsync -> Edit rsync
# Account). NOT a DSM user: these credentials exist only for the daemon.
NAS_RSYNC_USER=Backup
# One module per machine. A module IS a DSM shared folder — DSM offers no way to
# export a subdirectory — so each machine gets its own share rather than a
# subdirectory of a shared one, which would be a naming convention rather than a
# boundary.
NAS_MODULE=Backup-Sparky
NAS_PASSWORD_FILE=/home/ellie/.config/snh-backup/rsync-password


# How many nightly copies to keep. Copies are hardlinked against the previous
# night, so an unchanged file costs one inode, not another copy of itself.
KEEP=30

# The live SNH database. Snapshotted with sqlite3 .backup — never file-copied,
# because a 4MB WAL sitting beside it means a plain copy is a torn database.
# The LIVE database is the production entity's. Aurelius's chat.db travels
# as a plain file inside snh-data (he is stopped, so there is no WAL to tear).
SNH_DB=/home/ellie/snh-prod/data/chat.db

# Secrets are encrypted before they leave the box (gpg, key in
# /home/ellie/.config/snh-backup). Everything else travels in the clear so a
# restore needs nothing but rsync.
SECRETS_FILE=/home/ellie/snh/data/secrets.json
GPG_HOME=/home/ellie/.config/snh-backup/gnupg
GPG_KEYID_FILE=/home/ellie/.config/snh-backup/secrets-keyid

# What gets copied: "<label>|<source path>". The label is the directory name
# inside each nightly snapshot, so a restore is a plain copy back.
SOURCES="
# The production entity (Qwen3.8-27B NVFP4), live since the 8/23 engine swap.
snh-prod-data|/home/ellie/snh-prod/data
# Aurelius (Gemma lineage). Asleep, not migrated, kept under nightly
# protection anyway: it is small and it is the local copy behind the
# preserved NAS snapshot aurelius-gemma4-final-2026-08-23T152856.
snh-data|/home/ellie/snh/data
claude-state|/home/ellie/.claude
squatch-code|/home/ellie/squatch-code
squatch-code-projects|/home/ellie/Projects/Squatch-code
squatch-code-alt|/home/ellie/Squatch Code
sparky-stt|/home/ellie/sparky-stt
sparky-tts|/home/ellie/sparky-tts
searxng-config|/home/ellie/searxng-config
snh-documents|/home/ellie/SNH_Documents
"

# Excluded from snh-data: the live database and its WAL (the snapshot replaces
# them), the plaintext secrets (the encrypted copy replaces them), and chromium's
# print scratch directory, which is rebuilt on demand and holds nothing.
EXCLUDES="
chat.db
chat.db-wal
chat.db-shm
secrets.json
print-work/
"
